<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TGo — Animación de logo</title>
<style>
  :root{
    --navy-1:#14152a;
    --navy-2:#1e2040;
    --cream:#f3eee2;
    --orange:#f74211;
    --stage-bg:#0b0c18;
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    background:var(--stage-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  }

  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:28px;
    padding:60px 40px;
  }

  .icon-wrap{
    width:min(60vw,340px);
    filter:drop-shadow(0 30px 60px rgba(0,0,0,0.55));
  }

  svg{ display:block; width:100%; height:auto; overflow:visible; }

  /* ---------- base (pre-animation resting states) ---------- */
  .pin-group{ transform:translateY(-260px) rotate(-9deg) scale(0.85); opacity:0; transform-origin:100px 150px; }
  .shadow{ opacity:0; transform:scale(0.3); transform-origin:100px 152px; }
  .dot{ transform:translate(0px,0px) scale(1); transform-origin:100px 80px; }
  .dot-glow{ opacity:0; transform:scale(0.6); transform-origin:155px 45px; }
  .ring{ stroke-dasharray:100 100; stroke-dashoffset:100; }
  .wordmark{ opacity:0; transform:translateY(8px); }

  /* ---------- playing state: attach animations ---------- */
  .playing .pin-group{
    animation:pinDrop .95s cubic-bezier(.34,1.45,.55,1) .15s forwards;
  }
  .playing .shadow{
    animation:shadowGrow .95s ease-out .15s forwards;
  }
  .playing .dot{
    animation:
      dotTravel 1.05s cubic-bezier(.31,.85,.29,1.28) 1.1s forwards,
      dotIdlePulse 2.2s ease-in-out 3.55s infinite alternate;
  }
  .playing .dot-glow{
    animation:
      glowTravel 1.05s cubic-bezier(.31,.85,.29,1.28) 1.1s forwards,
      glowIdlePulse 2.2s ease-in-out 3.55s infinite alternate;
  }
  .playing .ring{
    animation:ringDraw 1.25s cubic-bezier(.45,.05,.25,1) 2.05s forwards;
  }
  .playing .wordmark{
    animation:fadeUp .8s ease-out 3.35s forwards;
  }

  @keyframes pinDrop{
    0%  { transform:translateY(-260px) rotate(-9deg) scale(0.85); opacity:0; }
    55% { transform:translateY(10px) rotate(2deg) scale(1.05); opacity:1; }
    72% { transform:translateY(-8px) rotate(-1deg) scale(0.97); }
    88% { transform:translateY(3px) rotate(0.5deg) scale(1.01); }
    100%{ transform:translateY(0) rotate(0deg) scale(1); opacity:1; }
  }

  @keyframes shadowGrow{
    0%  { opacity:0; transform:scale(0.25); }
    55% { opacity:.12; transform:scale(0.7); }
    72% { opacity:.32; transform:scale(1.18); }
    100%{ opacity:.24; transform:scale(1); }
  }

  @keyframes dotTravel{
    0%   { transform:translate(0px,0px) scale(1); }
    18%  { transform:translate(-2px,-4px) scale(1.32); }
    100% { transform:translate(55px,-35px) scale(0.92); }
  }
  @keyframes glowTravel{
    0%   { opacity:0; transform:translate(-55px,35px) scale(0.6); }
    18%  { opacity:.55; transform:translate(-57px,31px) scale(0.9); }
    100% { opacity:.55; transform:translate(0px,0px) scale(1); }
  }

  @keyframes dotIdlePulse{
    0%   { filter:drop-shadow(0 0 0 rgba(247,66,17,0)); }
    100% { filter:drop-shadow(0 0 7px rgba(247,66,17,.75)); }
  }
  @keyframes glowIdlePulse{
    0%   { opacity:.4; transform:translate(55px,-35px) scale(0.9); }
    100% { opacity:.7; transform:translate(55px,-35px) scale(1.25); }
  }

  @keyframes ringDraw{
    from{ stroke-dashoffset:100; }
    to  { stroke-dashoffset:0; }
  }

  @keyframes fadeUp{
    to{ opacity:1; transform:translateY(0); }
  }

  /* ---------- wordmark ---------- */
  .wordmark-text{
    text-align:center;
  }
  .wordmark-text .name{
    font-size:22px;
    letter-spacing:2.5px;
    color:var(--cream);
    font-weight:600;
  }
  .wordmark-text .name span{ color:var(--orange); }
  .wordmark-text .tag{
    margin-top:6px;
    font-size:12px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:#8b8ca3;
  }

  .replay{
    background:transparent;
    border:1px solid #33355a;
    color:#c9cadd;
    padding:9px 18px;
    border-radius:999px;
    font-size:13px;
    letter-spacing:0.5px;
    cursor:pointer;
    transition:border-color .2s ease, color .2s ease;
  }
  .replay:hover{ border-color:var(--orange); color:var(--cream); }

  @media (prefers-reduced-motion: reduce){
    .pin-group,.shadow,.dot,.dot-glow,.wordmark{ animation:none !important; opacity:1 !important; transform:none !important; }
    .dot{ transform:translate(55px,-35px) scale(0.92) !important; }
    .dot-glow{ transform:translate(55px,-35px) scale(1) !important; opacity:.5 !important; }
    .ring{ stroke-dashoffset:0 !important; }
  }
</style>
</head>
<body>

<div class="stage playing" id="stage">

  <div class="icon-wrap">
    <svg id="logoSvg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1c1d38"/>
          <stop offset="100%" stop-color="#111225"/>
        </linearGradient>
        <filter id="blur6" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="6"/>
        </filter>
      </defs>

      <!-- background -->
      <rect x="0" y="0" width="200" height="200" rx="46" fill="url(#bgGrad)"/>

      <!-- landing shadow -->
      <ellipse class="shadow" cx="100" cy="152" rx="24" ry="6" fill="#000000"/>

      <!-- pin (with hole revealing the background, matching the resting logo) -->
      <g class="pin-group">
        <path class="pin"
          d="M100,50
             C118.5,50 133,64.5 133,83
             C133,108 100,150 100,150
             C100,150 67,108 67,83
             C67,64.5 81.5,50 100,50 Z"
          fill="var(--cream)"/>
        <circle cx="100" cy="80" r="14" fill="#14152a"/>
      </g>

      <!-- soft glow that travels with the dot -->
      <circle class="dot-glow" cx="100" cy="80" r="20" fill="var(--orange)" filter="url(#blur6)"/>

      <!-- the orange dot: starts at the pin's center, travels to the ring's opening -->
      <circle class="dot" cx="100" cy="80" r="14" fill="var(--orange)"/>

      <!-- the open ring: draws itself, both ends resting beside the dot -->
      <path class="ring"
        d="M171.8,69.5 A78,78 0 1 1 130.5,28.2"
        fill="none" stroke="var(--cream)" stroke-width="9"
        stroke-linecap="round" pathLength="100"/>
    </svg>
  </div>

  <div class="wordmark">
    <div class="wordmark-text">
      <div class="name">T<span>GO</span></div>
      <div class="tag">Cerca de vos</div>
    </div>
  </div>

  <button class="replay" id="replayBtn">↻ Repetir animación</button>

</div>

<script>
  const stage = document.getElementById('stage');
  document.getElementById('replayBtn').addEventListener('click', () => {
    stage.classList.remove('playing');
    // force reflow so the animations restart from the base state
    void stage.offsetWidth;
    stage.classList.add('playing');
  });
</script>

</body>
</html>
