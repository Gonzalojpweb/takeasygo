name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=critical

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  # Lint solo de los archivos del SaaS que cambian en este push o PR. El
  # proyecto arrastra ~3.400 errores viejos (sobre todo no-explicit-any): con
  # `eslint .` el check quedaba siempre rojo y dejaba de avisar. Lo nuevo y lo
  # que se toca tiene que pasar; lo viejo se limpia de a poco al tocarlo.
  # Para correr el lint completo a mano: pnpm lint.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Lint de archivos cambiados (apps/saas)
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            BASE=$(git merge-base "origin/$BASE_REF" HEAD)
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            BASE="$BEFORE_SHA"
          else
            BASE=$(git rev-parse HEAD~1)
          fi
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE" HEAD -- 'apps/saas/**/*.ts' 'apps/saas/**/*.tsx' 'apps/saas/**/*.mjs' \
            | sed 's#^apps/saas/##')
          if [ -z "$FILES" ]; then
            echo "Sin archivos del SaaS para revisar."
            exit 0
          fi
          echo "Archivos revisados:"; echo "$FILES"
          cd apps/saas
          # no-explicit-any queda como aviso: es la deuda vieja (~2.900 de los errores).
          echo "$FILES" | xargs pnpm exec eslint --no-warn-ignored --rule "@typescript-eslint/no-explicit-any: warn"

  test:
    name: Tests (SaaS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      # Binario de mongod para MongoMemoryServer (tests de integración).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-8.0.4-${{ runner.os }}
      # Workers acotados: cada archivo de integración levanta su propio
      # MongoMemoryServer y en paralelo total compiten por el arranque.
      - run: pnpm --filter @takeasygo/saas exec vitest run --maxWorkers=2

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [audit, typecheck, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:pos