name: data-guard

on:
  push:
  pull_request:

jobs:
  block-sensitive-files:
    name: Bloquear datos de clientes y secretos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Guard de archivos sensibles (mismo script que el pre-commit)
        run: node .husky/checks/block-data-dumps.mjs --all

  gitleaks:
    name: Gitleaks (push y PR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
